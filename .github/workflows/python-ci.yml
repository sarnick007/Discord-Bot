name: Python bot checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile bot
        run: python -m py_compile bot.py

      - name: Validate required deployment files
        run: |
          test -s bot.py
          test -s requirements.txt
          grep -q '^discord.py==' requirements.txt
          grep -q '^python-dotenv==' requirements.txt
