name: Report to AiOps Enabler (OIDC, no secrets)

on:
  # A push that changes this workflow can exercise the OIDC/API path immediately.
  # Normal application-code pushes do not send extra reports.
  push:
    branches: [main]
    paths:
      - ".github/workflows/report-to-aiops-enabler.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aiops-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report task outcome via GitHub OIDC
        shell: bash
        env:
          OIDC_AUDIENCE: https://aiopsenabler.com/api/v1/events/github-oidc
          AIOPS_EVENT_URL: https://api.aiopsenabler.com/api/v1/events/github-oidc
        run: |
          set -uo pipefail

          # Fail with an actionable message rather than a bare curl exit code.
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub did not provide OIDC request variables. Confirm this workflow has id-token: write permission and that organization/repository policies allow OIDC."
            exit 1
          fi

          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          if [[ "$OIDC_URL" == *\?* ]]; then
            OIDC_URL="${OIDC_URL}&audience=${OIDC_AUDIENCE}"
          else
            OIDC_URL="${OIDC_URL}?audience=${OIDC_AUDIENCE}"
          fi

          echo "Requesting a short-lived GitHub OIDC token..."
          if ! OIDC_RESPONSE="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$OIDC_URL")"; then
            echo "::error::Could not obtain the GitHub OIDC token. Check runner network/DNS and GitHub OIDC availability; curl's diagnostic above identifies the failing request."
            exit 1
          fi

          OIDC_TOKEN="$(jq -er '.value | select(type == "string" and length > 0)' <<< "$OIDC_RESPONSE")" || {
            echo "::error::GitHub's OIDC response did not contain a non-empty token."
            exit 1
          }

          # Keep the request payload valid JSON and avoid printing the token.
          PAYLOAD="$(jq -cn --arg task_id "$GITHUB_RUN_ID" \
            '{event_type:"task_completed", task_id:$task_id, outcome:"success", duration_ms:1000}')"

          echo "Submitting the report to AiOps Enabler..."
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          if ! HTTP_STATUS="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 20 --retry 3 --retry-delay 2 --retry-all-errors \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -X POST "$AIOPS_EVENT_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")"; then
            echo "::error::Could not connect to AiOps Enabler. Check DNS/network availability for api.aiopsenabler.com."
            exit 1
          fi

          unset OIDC_TOKEN OIDC_RESPONSE ACTIONS_ID_TOKEN_REQUEST_TOKEN

          if [[ ! "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::AiOps Enabler rejected the report (HTTP $HTTP_STATUS)."
            jq -r '
              if type == "object" then
                "Category: " + (.detail.category // "unknown" | tostring),
                "Reason: " + (.detail.message // .detail // "No response detail supplied" | tostring),
                (if .detail.remediation then "Remediation: " + (.detail.remediation | tostring) else empty end)
              else "Response was not a JSON object." end
            ' "$RESPONSE_FILE" 2>/dev/null || head -c 1000 "$RESPONSE_FILE"
            exit 1
          fi

          echo "AiOps Enabler accepted the report (HTTP $HTTP_STATUS)."
